# projectd — Project-scoped development infrastructure: shared LSPs, filesystem events and MCP for editors and agents
#
# Single crate, `[lib]` + `[[bin]]`. The library holds the engine; the binary is
# a thin CLI over it, so integration tests can exercise either.

[package]
name = "projectd"
version = "0.1.0"
edition = "2024"
# The MSRV. Checked by a dedicated CI job, which greps this very line — keep it
# a plain literal. `rust-toolchain.toml` separately pins the channel to develop
# against; the two answer different questions.
rust-version = "1.88"
license = "MIT"
authors = ["Axel H. <noirbizarre@gmail.com>"]
description = "Project-scoped development infrastructure: shared LSPs, filesystem events and MCP for editors and agents"
repository = "https://github.com/noirbizarre/projectd"
homepage = "https://noirbizarre.github.io/projectd/"
documentation = "https://noirbizarre.github.io/projectd/"
readme = "README.md"
keywords = ["lsp", "mcp", "daemon", "devtools", "mise"]
categories = ["development-tools", "command-line-utilities"]
# Not published to crates.io. Distribution is through the release assets alone,
# and `cargo install projectd` would create a second install path that
# nothing tests and nobody updates.
publish = false

[[bin]]
name = "projectd"
path = "src/main.rs"

[lib]
name = "projectd"
path = "src/lib.rs"

[profile.release]
# Release binaries are cross-compiled once per tag and downloaded many times, so
# the build cost is paid once and the size saving is paid forward.
lto = true
codegen-units = 1
strip = true

# --- project-specific --------------------------------------------------------
#
# Everything above this line is owned by the template and will keep updating.
# Everything below is yours.
#
# The template seeds these two sections once, at `git tpl init`, and then leaves
# them alone: Dependabot bumps versions here weekly, and a template that
# propagated its own would open a conflict against every one of those PRs.
# Resolve in favour of the project if `git tpl update` ever touches them.

[dependencies]
# Errors & diagnostics. `thiserror` for typed errors inside the library,
# `miette` to render them at the binary edge.
thiserror = "2"
miette = { version = "7", features = ["fancy"] }

# CLI
clap = { version = "4", features = ["derive", "env", "wrap_help"] }
console = "0.16"
demand = "2"

# Configuration & serialisation
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

# --- projectd itself ----------------------------------------------------
#
# Everything below is projectd's own additions, kept below the template's
# marker so `git tpl update` never conflicts with them.

# net/process: Unix sockets + spawning LSP servers with piped stdio.
# signal: graceful daemon shutdown on SIGINT/SIGTERM.
# The rest is what a multi-client, multi-process async daemon needs.
tokio = { version = "1", features = ["rt-multi-thread", "net", "process", "fs", "io-util", "io-std", "macros", "signal", "sync", "time"] }

# Templating: ProjectD resolves `{{ env.* }}` templates server-side so
# clients never need their own Jinja engine (spec §6/§18).
minijinja = "2"

# Filesystem watching: cross-platform (inotify/FSEvents/...) abstraction plus
# save-as-rename debouncing, so editors' atomic saves emit one event, not three.
notify = "8"
notify-debouncer-full = "0.7"

# XDG-aware config/data/cache directories.
directories = "6"

# Layered TOML config parsing. Merge semantics are hand-rolled (see
# docs/adr/0002-config-layering-and-merge-semantics.md) rather than pulled
# from a generic layered-config crate, because the required per-field rules
# (definitions merge by key, activation lists replace wholesale, JSON blobs
# deep-merge) do not map onto a one-size-fits-all merge strategy.
toml = "1"

# Path glob matching for the event stream and watch rules.
globset = "0.4"

# Shared vocabulary for LSP `initializationOptions`/capabilities, so those
# fields are validated/typed rather than opaque JSON all the way through.
lsp-types = "0.97"

# The official Model Context Protocol Rust SDK, used for `projectd mcp serve`.
rmcp = { version = "3", features = ["server", "macros", "transport-io"] }
# MCP tool argument/result schemas — the same version rmcp itself pulls in,
# declared directly since `mcp::tools` derives `JsonSchema` on its own types.
schemars = "1"

# Structured logging for a long-lived daemon juggling multiple LSP
# subprocesses and client connections concurrently.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Per-daemon-instance identity, exchanged in the handshake.
uuid = { version = "1", features = ["v4", "serde"] }

# Deterministic Unix socket path derivation from a canonical project root
# (see docs/adr/0004-deterministic-socket-discovery.md) — discovery is a
# pure function of the root, not a lookup table.
sha2 = "0.11"

async-trait = "0.1"

# `getuid`, for the /tmp fallback runtime directory when $XDG_RUNTIME_DIR is
# unset (Unix-only build, see docs/adr/0003-unix-only-platform-scope.md).
libc = "0.2"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
insta = { version = "1", features = ["filters"] }
rstest = "0.26"
pretty_assertions = "1"
# The MCP integration tests act as an MCP client over an in-memory duplex
# transport, which needs rmcp's "client" feature (not needed by the binary
# itself, which is only ever an MCP server).
rmcp = { version = "3", features = ["client"] }

# projectd — Project-scoped development infrastructure: shared LSPs, filesystem events and MCP for editors and agents
#
# Single crate, `[lib]` + `[[bin]]`. The library holds the engine; the binary is
# a thin CLI over it, so integration tests can exercise either.

[package]
name = "projectd"
version = "0.1.0"
edition = "2024"
# The MSRV. Checked by a dedicated CI job, which greps this very line — keep it
# a plain literal. `rust-toolchain.toml` separately pins the channel to develop
# against; the two answer different questions.
rust-version = "1.88"
license = "MIT"
authors = ["Axel H. <noirbizarre@gmail.com>"]
description = "Project-scoped development infrastructure: shared LSPs, filesystem events and MCP for editors and agents"
repository = "https://github.com/noirbizarre/projectd"
homepage = "https://noirbizarre.github.io/projectd/"
documentation = "https://noirbizarre.github.io/projectd/"
readme = "README.md"
keywords = ["lsp", "mcp", "daemon", "devtools", "mise"]
categories = ["development-tools", "command-line-utilities"]
# Not published to crates.io. Distribution is through the release assets alone,
# and `cargo install projectd` would create a second install path that
# nothing tests and nobody updates.
publish = false

[[bin]]
name = "projectd"
path = "src/main.rs"

[lib]
name = "projectd"
path = "src/lib.rs"

[profile.release]
# Release binaries are cross-compiled once per tag and downloaded many times, so
# the build cost is paid once and the size saving is paid forward.
lto = true
codegen-units = 1
strip = true

# --- project-specific --------------------------------------------------------
#
# Everything above this line is owned by the template and will keep updating.
# Everything below is yours.
#
# The template seeds these two sections once, at `git tpl init`, and then leaves
# them alone: Dependabot bumps versions here weekly, and a template that
# propagated its own would open a conflict against every one of those PRs.
# Resolve in favour of the project if `git tpl update` ever touches them.

[dependencies]
# Errors & diagnostics. `thiserror` for typed errors inside the library,
# `miette` to render them at the binary edge.
thiserror = "2"
miette = { version = "7", features = ["fancy"] }

# CLI
clap = { version = "4", features = ["derive", "env", "wrap_help"] }
console = "0.16"
demand = "2"

# Configuration & serialisation
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
insta = { version = "1", features = ["filters"] }
rstest = "0.26"
pretty_assertions = "1"

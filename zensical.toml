# Zensical configuration.
# https://zensical.org/docs/setup/

[project]

site_name = "lspd"
site_description = "Project-scoped development infrastructure: shared LSPs, filesystem events and MCP for editors and agents"
site_url = "https://noirbizarre.github.io/lspd/"
site_author = "noirbizarre"

repo_url = "https://github.com/noirbizarre/lspd"
repo_name = "noirbizarre/lspd"
edit_uri = "edit/main/docs/"

copyright = """
Copyright &copy; 2026 Axel H. — MIT licensed
"""

# Seeded, not owned: the navigation is the one part of this file that is
# entirely about your project. Extend it freely — the template will not
# meaningfully conflict with additions here.
nav = [
  { "Home" = "index.md" },
  { "Architecture" = "architecture.md" },
  { "Configuration" = "configuration.md" },
  { "LSP" = "lsp.md" },
  { "Events and watch rules" = "events.md" },
  { "Protocol" = "protocol.md" },
  { "MCP" = "mcp.md" },
  { "About" = [
    { "Architecture Decisions" = "adr/README.md" },
    { "ADR-0001: definitions vs activation" = "adr/0001-lsp-definitions-vs-activation.md" },
    { "ADR-0002: config layering and merge semantics" = "adr/0002-config-layering-and-merge-semantics.md" },
    { "ADR-0003: Unix-only platform scope" = "adr/0003-unix-only-platform-scope.md" },
    { "ADR-0004: deterministic socket discovery" = "adr/0004-deterministic-socket-discovery.md" },
    { "ADR-0005: single exclusive LSP proxy client" = "adr/0005-single-exclusive-lsp-proxy-client.md" },
    { "ADR-0006: server-side template resolution" = "adr/0006-server-side-template-resolution.md" },
    { "ADR-0007: Mise as a pluggable environment provider" = "adr/0007-mise-as-pluggable-environment-provider.md" },
    { "ADR-0008: event stream independent of watch rules" = "adr/0008-event-stream-independent-of-watch-rules.md" },
    { "ADR-0009: single crate structure" = "adr/0009-single-crate-structure.md" },
  ] },
]

[project.theme]

language = "en"

# The header slot is one line tall and already sits next to the site name, so
# it gets the mark alone — a wordmark would render as an illegible sliver and
# repeat the name.
logo = "images/icon.svg"
favicon = "images/icon.svg"

features = [
  "content.action.edit",
  "content.code.annotate",
  "content.code.copy",
  "navigation.instant",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "search.suggest",
  "toc.follow",
]

# Three entries, in this order. The first has no `scheme`, so it follows the
# operating system — and being first, it is what a visitor gets by default. The
# other two let anyone override that choice, which then persists.
[[project.theme.palette]]
media = "(prefers-color-scheme)"
primary = "black"
accent = "indigo"
toggle.icon = "lucide/monitor"
toggle.name = "Following your system — switch to light"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "black"
accent = "indigo"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "black"
accent = "indigo"
toggle.icon = "lucide/moon"
toggle.name = "Switch to following your system"

# Markdown extensions used by the documentation. Admonitions and tabs carry
# most of the guidance; superfences is required for fenced code blocks with
# annotations.
[project.markdown_extensions.abbr]
[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.def_list]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.tables]
[project.markdown_extensions.toc]
permalink = true
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.superfences]
[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true
[project.markdown_extensions.pymdownx.tasklist]
custom_checkbox = true

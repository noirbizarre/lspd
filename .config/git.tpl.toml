# This file is versioned with the project. Edit an answer and run
# `git tpl update` to re-render the template with it.

[template]
source = "https://github.com/noirbizarre/rust.tpl"

[answers]
author = "Axel H. <noirbizarre@gmail.com>"
bin_name = "lspd"
categories = "development-tools,command-line-utilities"
copyright_holder = "Axel H."
copyright_year = 2026
crate = "lspd"
description = "Project-scoped development infrastructure: shared LSPs, filesystem events and MCP for editors and agents"
docs = true
docs_accent = "indigo"
keywords = "lsp,mcp,daemon,devtools,mise"
msrv = true
msrv_version = "1.88"
owner = "noirbizarre"
publish = false
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
]
